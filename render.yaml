services:
  - type: web
    name: document-authenticity-api
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: MAX_UPLOAD_SIZE_MB
        value: "10.0"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.10.12"
